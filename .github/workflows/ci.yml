name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Builds the Mac app on both kinds of Mac without releasing anything: a dry
  # run of what a tag will do.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Ruff
        run: uvx ruff@0.6 check packages/ tests/ firmware/

  test:
    name: Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Test with coverage
        run: |
          if uv run pytest tests/heare tests/firmware -q --cov=heare --cov-report=term-missing --cov-fail-under=80; then
            exit 0
          fi
          # The bench's hands hang past the 120 s timeout on a runner now and
          # then and never on a desk (twice on 14 November). Retry exactly
          # what failed once: a real failure fails twice and stays red.
          if [ -s .pytest_cache/v/cache/lastfailed ]; then
            echo "::warning::retrying the tests that failed once"
            uv run pytest tests/heare tests/firmware -q --last-failed
          else
            exit 1
          fi

      - name: Typecheck
        run: uv run mypy


  build:
    name: Build wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build
        run: uv build --all-packages -o dist

      - name: Keep the wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl
          if-no-files-found: error

  android:
    name: Phone APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The action installs the obsolete «tools» package by default, and
      # sdkmanager no longer has it (7 November). The SDK the build needs
      # Gradle fetches itself once the licences are accepted here.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # The build fetches the VAD library and the wake-word model itself;
      # between runs they are already here.
      - uses: actions/cache@v4
        with:
          path: apps/mobile/build/vendor
          key: phone-vendor-${{ hashFiles('apps/mobile/phone/build.gradle.kts') }}

      - uses: gradle/actions/setup-gradle@v4

      # One version everywhere, or the phone cannot be released beside the rest.
      - name: The phone's version is the packages'
        working-directory: apps/mobile
        run: |
          packages=$(sed -n 's/^version = "\(.*\)"/\1/p' ../../packages/heare-core/pyproject.toml | head -1)
          phone=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' phone/build.gradle.kts | head -1)
          test "$phone" = "$packages" || { echo "phone $phone, packages $packages — make release writes both"; exit 1; }

      # The signing key is a secret; without it the release APK is not built at
      # all, and the release ships without a phone build rather than with an
      # unsigned one Android would refuse to install over the next.
      - name: The signing key, when there is one
        id: key
        env:
          KEYSTORE: ${{ secrets.HEARE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/heare.jks"
            echo "path=$RUNNER_TEMP/heare.jks" >> "$GITHUB_OUTPUT"
          else
            echo "no signing key: the phone build stays debug-only"
          fi

      - name: Test and build
        working-directory: apps/mobile
        env:
          HEARE_KEYSTORE: ${{ steps.key.outputs.path }}
          HEARE_KEYSTORE_PASSWORD: ${{ secrets.HEARE_KEYSTORE_PASSWORD }}
          HEARE_KEY_ALIAS: ${{ secrets.HEARE_KEY_ALIAS }}
          HEARE_KEY_PASSWORD: ${{ secrets.HEARE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :shared:testDebugUnitTest :phone:assembleDebug
          if [ -n "$HEARE_KEYSTORE" ]; then ./gradlew --no-daemon :phone:assembleRelease; fi

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-apk
          path: apps/mobile/phone/build/outputs/apk/**/*.apk
          if-no-files-found: error

  app:
    name: Mac app (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test]
    strategy:
      matrix:
        include:
          # The app carries its machine's wheels, so each is built on its own
          # kind of Mac.
          - { arch: arm64, runner: macos-latest }
          - { arch: x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: The tag is the packages' version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' packages/heare-core/pyproject.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, packages $version"; exit 1; }

      - name: Build
        run: make app

      - name: Name it for its Mac
        run: mv dist/heare.dmg "dist/heare-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.arch }}
          path: dist/heare-${{ matrix.arch }}.dmg
          if-no-files-found: error

  image:
    name: Brain image
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The brain has to live inside the fence compose gives it, or it is not
      # released: read-only, no capabilities, only its volume.
      - name: The brain starts as compose runs it
        run: |
          docker compose -f docker/compose.yaml build
          docker compose -f docker/compose.yaml up -d
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9790/api/state || true)
            [ "$code" = 401 ] && exit 0
            sleep 2
          done
          docker compose -f docker/compose.yaml logs
          exit 1

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A dry run builds it and pushes nothing. A tag is the version and the
      # newest; compose takes either.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/brain.Dockerfile
          # The mini-PC is x86_64; arm64 was built under emulation, the slowest step.
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/onelenyk/heare-brain:${{ github.ref_name }}
            ghcr.io/onelenyk/heare-brain:latest

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build, android, app, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: phone-apk
          path: phone

      # A debug APK has another key and would block every later update, so
      # only the signed one is carried into the release.
      - name: The phone's APK, when it is signed
        run: |
          apk=$(ls phone/release/*.apk 2>/dev/null || true)
          if [ -n "$apk" ]; then cp "$apk" dist/heare-phone.apk; else echo "no signed APK this time"; fi

      # The app checks the dmg it downloads against this before it updates;
      # install.sh checks every wheel it fetches from the same file.
      - name: Sums
        run: |
          cp install.sh dist/
          (cd dist && sha256sum *.dmg *.whl install.sh $(ls *.apk 2>/dev/null) > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls dist/*.apk 2>/dev/null || true)
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.dmg dist/install.sh $apk dist/SHA256SUMS.txt --generate-notes
