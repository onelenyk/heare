name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: src/frontend/package-lock.json

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: brew install portaudio libomp

    - name: Build frontend
      run: |
        cd src/frontend
        npm ci
        npm run build

    - name: Sync Python dependencies
      run: uv sync --frozen

    - name: Build .app with PyInstaller
      run: uv run pyinstaller HeareMenubar.spec

    - name: Create .dmg
      run: hdiutil create -volname Heare -srcfolder dist/Heare.app -ov -format UDZO Heare.dmg

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: Heare.dmg
        generate_release_notes: true
