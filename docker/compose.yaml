# The brain on a server. From a release, no checkout's code:
#
#   HEARE_VERSION=v0.9.3 docker compose -f docker/compose.yaml pull
#   HEARE_VERSION=v0.9.3 docker compose -f docker/compose.yaml up -d
#
# Or built from the checkout:
#
#   DEEPSEEK_API_KEY=… GROQ_API_KEY=… docker compose -f docker/compose.yaml up -d --build
#   docker compose -f docker/compose.yaml exec brain heare-brain code   # a code to pair a browser or a body
#   docker compose -f docker/compose.yaml exec brain cat .heare/machine/api_token  # the master token
#
# The port is published on this machine's loopback only: reach it over
# `ssh -L 9790:127.0.0.1:9790 user@server`, or put a TLS proxy in front.
# HEARE_BIND=0.0.0.0 publishes it to the network as plain http — the token
# guards every route, but anyone on the path could read it. HEARE_PORT
# moves the published port when 9790 is taken.
services:
  brain:
    build:
      context: ..
      dockerfile: docker/brain.Dockerfile
    image: ghcr.io/onelenyk/heare-brain:${HEARE_VERSION:-latest}
    restart: unless-stopped
    # The brain holds the keys: it gets its volume and nothing else.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HEARE_BIND:-127.0.0.1}:${HEARE_PORT:-9790}:9790"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - heare:/home/heare/.heare

volumes:
  heare:
