; Two processes, one container: the brain answers, the keeper holds the
; parts. Both log to the container's own streams, so `docker logs` and
; Coolify show one history. The brain goes first; the keeper waits for it
; by itself (it knocks until the door answers).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:brain]
command=heare-brain
priority=10
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:keeper]
command=heare-keeper
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
