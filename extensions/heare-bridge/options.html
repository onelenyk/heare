<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Heare Bridge Options</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.2rem; margin-bottom: 24px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.9rem; }
    input { display: block; width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 0.95rem; border: 1px solid #bbb; border-radius: 4px; margin-bottom: 16px; }
    button { padding: 8px 20px; font-size: 0.95rem; background: #0a6; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #085; }
    #status { margin-top: 20px; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    #status-dot { width: 12px; height: 12px; border-radius: 50%; background: #888; flex-shrink: 0; }
    #status-dot.green { background: #0a0; }
    #status-dot.red { background: #c00; }
  </style>
</head>
<body>
  <h1>Heare Bridge</h1>

  <label for="token">Bridge token</label>
  <input type="password" id="token" placeholder="Paste token from ~/.heare/browser_bridge.token">

  <label for="port">Port</label>
  <input type="number" id="port" value="9333" min="1" max="65535">

  <hr style="margin: 24px 0; border: none; border-top: 1px solid #ddd;">

  <h2 style="font-size: 1rem; margin-bottom: 16px;">Pair with daemon</h2>
  <p style="font-size: 0.85rem; color: #666; margin-bottom: 16px;">
    Enter the 6-digit code shown on the Heare dashboard to pair automatically.
  </p>

  <label for="pair-code">Pair code</label>
  <input type="text" id="pair-code" placeholder="123456" maxlength="6" pattern="[0-9]{6}" style="font-family: monospace; letter-spacing: 2px;">

  <button id="pair">Pair</button>

  <hr style="margin: 24px 0; border: none; border-top: 1px solid #ddd;">

  <button id="save">Save &amp; reconnect</button>

  <div id="status">
    <span id="status-dot"></span>
    <span id="status-text">Loading…</span>
  </div>

  <script src="options.js"></script>
</body>
</html>
