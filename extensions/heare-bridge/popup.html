<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Heare Bridge</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 280px;
      padding: 16px;
      margin: 0;
      color: #222;
    }
    h1 {
      font-size: 1rem;
      margin: 0 0 16px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #888;
    }
    .dot.green { background: #0a0; }
    .dot.red { background: #c00; }
    .dot.grey { background: #888; }
    .status-text {
      font-size: 0.9rem;
    }
    .status-text.connected { color: #0a0; font-weight: 600; }
    .status-text.failed { color: #c00; }
    .status-text.disconnected { color: #666; }
    .info-row {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 4px;
    }
    .info-row span {
      color: #222;
    }
    hr {
      border: none;
      border-top: 1px solid #ddd;
      margin: 16px 0;
    }
    button {
      width: 100%;
      padding: 8px;
      font-size: 0.9rem;
      background: #0a6;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #085; }
  </style>
</head>
<body>
  <h1>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
    </svg>
    Heare Bridge
  </h1>

  <div class="status-row">
    <span id="status-dot" class="dot grey"></span>
    <span id="status-text" class="status-text disconnected">Loading…</span>
  </div>

  <div class="info-row">Port: <span id="port">-</span></div>

  <hr>

  <button id="options">Open Options</button>

  <script src="popup.js"></script>
</body>
</html>
