<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>heare</title>
<style>
  /* The old dashboard's palette: warm near-black, one violet accent,
     muted semantic hues kept apart from it. */
  :root {
    --bg:#131217; --card:#1c1a21; --card-2:#242029; --line:#302c37;
    --ink:#ece8e2; --soft:#96909e; --accent:#9d7cff; --accent-ink:#17141d;
    --ok:#5fbf8f; --warn:#dbb64f; --bad:#ef7a6b; --info:#6fb8d9;
    --sans:-apple-system,'Segoe UI',system-ui,sans-serif;
    --mono:'SF Mono','Fira Code','Cascadia Code',ui-monospace,monospace;
  }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--ink); font:14px/1.55 var(--sans); -webkit-font-smoothing:antialiased; }
  button, input, select { font:inherit; color:inherit; }
  ::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-thumb { background:var(--line); border-radius:3px; }

  #app { display:grid; grid-template-columns:380px minmax(0,1fr); height:100vh; }
  @media (max-width:860px) { #app { grid-template-columns:minmax(0,1fr); height:auto; } #left { height:auto; } #stage { height:70vh; } }

  /* ── the panel ── */
  #left { border-right:1px solid var(--line); background:var(--card); display:flex; flex-direction:column; min-height:0; height:100vh; }
  #pult { overflow-y:auto; font-family:var(--mono); font-size:12.5px; flex:1 1 auto; min-height:120px; }
  .block { padding:16px 18px; border-bottom:1px solid var(--line); }
  .label { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--soft); margin-bottom:10px; }
  #who { display:flex; align-items:baseline; gap:10px; }
  #open-settings { border:0; background:transparent; color:var(--soft); cursor:pointer; font-size:15px; padding:0 2px; }
  #open-settings:hover { color:var(--ink); }
  #name { font:800 22px/1 var(--sans); letter-spacing:-.4px; }
  #up { color:var(--soft); font:11px var(--mono); margin-left:auto; }
  #now { display:flex; align-items:center; gap:10px; margin-top:14px; font:600 17px/1.2 var(--sans); }
  #dot { width:12px; height:12px; border-radius:50%; background:var(--soft); flex:none; }
  #dot.hearing { background:var(--info); box-shadow:0 0 10px var(--info); }
  #dot.thinking { background:var(--warn); animation:pulse 1s ease infinite; }
  #dot.speaking { background:var(--accent); box-shadow:0 0 12px var(--accent); animation:pulse 1.4s ease infinite; }
  #dot.off { background:var(--bad); }
  @keyframes pulse { 50% { opacity:.4; } }
  .lanes { display:grid; gap:8px; margin-top:14px; }
  .lane { display:grid; grid-template-columns:44px 1fr; align-items:center; gap:10px; color:var(--soft); }
  .bar { height:6px; border-radius:3px; background:var(--card-2); overflow:hidden; }
  .bar i { display:block; height:100%; width:0; border-radius:3px; transition:width .25s ease; }
  .bar.live i { width:100%; background:linear-gradient(90deg, transparent, currentColor, transparent); background-size:200% 100%; animation:wave 1.2s linear infinite; }
  @keyframes wave { from { background-position:200% 0; } to { background-position:-200% 0; } }
  #you { color:var(--info); } #it { color:var(--accent); }

  .keys { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .key { display:flex; align-items:center; gap:8px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card-2); cursor:pointer; text-align:left; transition:border-color .15s, background .15s; }
  .key:hover:not(:disabled) { border-color:var(--accent); }
  .key:disabled { opacity:.4; cursor:default; }
  .key b { font-weight:600; } .key small { display:block; color:var(--soft); font-size:10.5px; }
  .key .led { width:8px; height:8px; border-radius:50%; background:var(--ok); flex:none; }
  .key.off { border-color:var(--bad); } .key.off .led { background:var(--bad); }
  .key.wide { grid-column:1 / -1; }
  .key.stop { background:var(--bad); border-color:var(--bad); color:var(--accent-ink); justify-content:center; font-weight:700; }
  .key.stop:hover { filter:brightness(1.1); }
  .vol { grid-column:1 / -1; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; color:var(--soft); }
  input[type=range] { accent-color:var(--accent); width:100%; }

  .rows { display:grid; gap:6px; }
  .row { display:grid; grid-template-columns:82px 1fr; gap:10px; }
  .row > span:first-child { color:var(--soft); }
  .row b { font-weight:600; } .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  #spark { vertical-align:middle; margin-left:6px; }

  .task { padding:9px 0; border-top:1px dashed var(--line); display:grid; grid-template-columns:1fr auto; gap:8px; align-items:start; }
  .task:first-child { border-top:0; padding-top:0; }
  .task p { font-family:var(--sans); font-size:13px; overflow-wrap:anywhere; }
  .task small { color:var(--soft); }
  .mini { padding:3px 9px; border:1px solid var(--line); border-radius:6px; background:transparent; cursor:pointer; font-size:11.5px; }
  .mini:hover { border-color:var(--accent); }
  .ask { border:1px solid var(--warn); border-radius:10px; padding:11px; margin-bottom:12px; background:rgba(219,182,79,.07); }
  .ask p { font-family:var(--sans); font-size:13.5px; margin-bottom:9px; }
  .ask button { margin-right:6px; }
  .yes { background:var(--ok); border-color:var(--ok); color:var(--accent-ink); font-weight:700; }
  .empty { color:var(--soft); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { padding:4px 10px; border:1px solid var(--line); border-radius:999px; background:transparent; cursor:pointer; font-size:11.5px; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  /* ── the conversation: compact, under the panel ── */
  #talkcol { flex:0 0 40%; min-height:240px; display:flex; flex-direction:column; border-top:1px solid var(--line); background:var(--bg); }
  #talk { flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:7px; }
  .line { max-width:88%; padding:7px 11px; border-radius:12px; white-space:pre-wrap; overflow-wrap:anywhere; font-size:13px; line-height:1.45; }
  .me { align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:4px; }
  .it { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .old { opacity:.55; }
  .via { display:block; font:10px var(--mono); opacity:.7; margin-top:2px; }
  .aside { align-self:center; color:var(--soft); font:10.5px var(--mono); text-align:center; max-width:92%; }
  .divider { align-self:stretch; display:flex; align-items:center; gap:10px; color:var(--soft); font:10px var(--mono); letter-spacing:.1em; text-transform:uppercase; margin:4px 0; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:var(--line); }
  #say { display:flex; gap:8px; padding:10px 12px 12px; border-top:1px solid var(--line); }
  #say input { flex:1; min-width:0; background:var(--card); border:1px solid var(--line); border-radius:9px; padding:9px 12px; font-size:13.5px; }
  #say input:focus { outline:none; border-color:var(--accent); }
  #say button { background:var(--accent); color:var(--accent-ink); border:0; border-radius:9px; padding:0 14px; font-weight:700; cursor:pointer; }

  /* ── the canvas: the centre, where it draws ── */
  #stage { display:flex; flex-direction:column; min-width:0; height:100vh; }
  #tabs { display:flex; gap:6px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); overflow-x:auto; min-height:47px; }
  #tabs .label { margin:0 8px 0 0; flex:none; }
  .chip.on { border-color:var(--accent); color:var(--accent); }
  #canvas { flex:1; position:relative; min-height:0; }
  #frame { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); display:none; }
  #blank { position:absolute; inset:0; display:grid; place-content:center; text-align:center; color:var(--soft); padding:24px; gap:8px; }
  #blank b { font:600 20px var(--sans); color:var(--ink); }
  #blank span { font:12.5px var(--mono); }
  #drawing { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); background:var(--card); border:1px solid var(--accent); border-radius:999px; padding:6px 14px; font:12px var(--mono); color:var(--accent); display:none; animation:pulse 1.4s ease infinite; }

  /* ── settings and screens: over the top, out of the way ── */
  .veil { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:10; }
  .veil.on { display:block; }
  #settings { position:fixed; top:0; left:0; bottom:0; width:min(420px, 100%); background:var(--card); border-right:1px solid var(--line); padding:22px; overflow-y:auto; transform:translateX(-100%); transition:transform .2s ease; z-index:11; }
  #settings.on { transform:none; }
  #settings h2 { font-size:18px; margin-bottom:18px; }
  #settings h3 { font:10px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--soft); margin:22px 0 10px; }
  .field { display:grid; gap:6px; margin-bottom:10px; }
  .field label { color:var(--soft); font-size:12px; }
  .field input, .field select { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 11px; min-width:0; }
  .pair { display:grid; grid-template-columns:1fr auto; gap:8px; }
  .btn { background:var(--accent); color:var(--accent-ink); border:0; border-radius:8px; padding:9px 14px; font-weight:700; cursor:pointer; }
  .note { color:var(--soft); font-size:12px; min-height:18px; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>

<div id="app">
  <div id="left">
    <aside id="pult">
      <div class="block">
        <div id="who"><span id="name">heare</span><span id="up"></span><button id="open-settings" title="налаштування: ключі, модель">⚙</button></div>
        <div id="now"><span id="dot"></span><span id="nowtext">…</span></div>
        <div class="lanes">
          <div class="lane"><span>ти</span><div class="bar" id="you"><i></i></div></div>
          <div class="lane"><span>він</span><div class="bar" id="it"><i></i></div></div>
        </div>
      </div>

      <div class="block">
        <div class="label">Керування</div>
        <div class="keys">
          <button class="key" id="mic"><span class="led"></span><span><b>Мікрофон</b><small></small></span></button>
          <button class="key" id="speaker"><span class="led"></span><span><b>Звук</b><small></small></span></button>
          <div class="vol"><span>гучність</span><input id="volume" type="range" min="0" max="1" step="0.05"><span id="volpct"></span></div>
          <button class="key wide" id="listen"><span class="led"></span><span><b></b><small></small></span></button>
          <button class="key" id="pause"><span class="led"></span><span><b>Пауза</b><small>глухий і німий</small></span></button>
          <button class="key stop" id="stop">■ Стоп</button>
        </div>
      </div>

      <div class="block">
        <div class="label">Стан</div>
        <div class="rows">
          <div class="row"><span>модель</span><span id="model">…</span></div>
          <div class="row"><span>руки</span><span id="hands">…</span></div>
          <div class="row"><span>відповідь</span><span><span id="speed">—</span><svg id="spark" width="70" height="16"></svg></span></div>
          <div class="row"><span>цей запуск</span><span id="session">…</span></div>
        </div>
      </div>

      <div class="block">
        <div class="label">Тримаю в голові</div>
        <div id="ask"></div>
        <div id="tasks"><p class="empty">Зараз нічого не роблю.</p></div>
      </div>
    </aside>

    <section id="talkcol">
      <div id="talk"></div>
      <form id="say"><input id="text" placeholder="Напиши…" autocomplete="off" autofocus><button>→</button></form>
    </section>
  </div>

  <main id="stage">
    <div id="tabs"><span class="label">Канвас</span><span id="screens" class="chips"></span></div>
    <div id="canvas">
      <div id="blank"><b>Тут він малює</b><span>Попроси: «покажи таблицею…», «намалюй…», «зроби екран…»</span></div>
      <iframe id="frame" title="канвас"></iframe>
      <div id="drawing">малює…</div>
    </div>
  </main>
</div>

<div class="veil" id="veil"></div>
<aside id="settings">
  <h2>Налаштування</h2>
  <h3>Модель для розмови</h3>
  <div class="field"><label for="provider">провайдер</label><select id="provider"></select></div>
  <div class="field"><label for="modelname">модель</label><div class="pair"><input id="modelname" placeholder="назва моделі"><button class="btn" id="save-model">Зберегти</button></div></div>
  <p class="note" id="modelnote"></p>
  <h3>Ключі</h3>
  <div class="field"><label for="keyname">який ключ</label><select id="keyname"></select></div>
  <div class="field"><label for="keyvalue">значення</label><div class="pair"><input id="keyvalue" type="password" placeholder="встав токен" autocomplete="off"><button class="btn" id="save-key">Зберегти</button></div></div>
  <p class="note" id="keynote">Ключ можна зберегти, але не можна прочитати назад.</p>
</aside>

<script>
const T = window.HEARE_TOKEN, $ = id => document.getElementById(id);
const api = (path, opts = {}) => fetch("/api/" + path, {
  ...opts, headers: {"X-Heare-Token": T, "Content-Type": "application/json"},
  body: opts.body ? JSON.stringify(opts.body) : undefined,
}).then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t)));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

const NOW = {idle: "чекає", hearing: "слухає тебе", thinking: "думає", speaking: "говорить"};
const VIA = {voice: "голосом", text: "текстом", screen: ""};
const WHY = {busy: "був зайнятий", "chose silence": "вирішив не відповідати"};
let voice = null, phase = "idle", state = null, writing = null, askedAt = null;
const speeds = [];

/* ── the conversation ── */
function line(text, who, via) {
  const e = el("div", "line " + who, text);
  if (VIA[via]) e.append(el("span", "via", VIA[via]));
  $("talk").append(e); $("talk").scrollTop = $("talk").scrollHeight;
  return e;
}
const aside = text => { $("talk").append(el("div", "aside", text)); $("talk").scrollTop = $("talk").scrollHeight; };

api("history?n=20").then(past => {
  const frag = document.createDocumentFragment();
  for (const turn of past) {
    if (turn.user) frag.append(el("div", "line me old", turn.user));
    if (turn.agent) frag.append(el("div", "line it old", turn.agent));
  }
  if (past.length) frag.append(el("div", "divider", "зараз"));
  $("talk").prepend(frag); $("talk").scrollTop = $("talk").scrollHeight;
}).catch(() => {});

/* ── the panel ── */
function show() {
  const off = voice && !voice.mic && !voice.speaker;
  $("dot").className = off ? "off" : phase;
  $("nowtext").textContent = off ? "на паузі" : NOW[phase] + (voice ? (voice.mic ? "" : " · не чує") : " · без голосу");
  $("you").classList.toggle("live", phase === "hearing" && !off);
  $("it").classList.toggle("live", phase === "thinking" || phase === "speaking");
  for (const id of ["mic", "speaker", "volume", "listen", "pause"]) $(id).disabled = !voice;
  const set = (id, on, small) => { $(id).classList.toggle("off", !on); $(id).querySelector("small").textContent = small; };
  if (!voice) {
    set("mic", true, "немає голосу"); set("speaker", true, "запусти з --voice");
    $("listen").querySelector("b").textContent = "Голос вимкнено"; $("listen").querySelector("small").textContent = "працює лише текст";
    $("volpct").textContent = ""; return;
  }
  set("mic", voice.mic, voice.mic ? "чує" : "вимкнено");
  set("speaker", voice.speaker, voice.speaker ? "говорить" : "вимкнено");
  if (document.activeElement !== $("volume")) $("volume").value = voice.volume;
  $("volpct").textContent = Math.round(voice.volume * 100) + "%";
  $("listen").querySelector("b").textContent = voice.listen === "name" ? "Відповідає лише на ім'я" : "Сам вирішує, чи відповідати";
  $("listen").querySelector("small").textContent = voice.listen === "name" ? "скажи «Дока, …»" : "ім'я не обов'язкове";
  $("pause").classList.toggle("off", !!off);
  $("pause").querySelector("b").textContent = off ? "Увімкнути" : "Пауза";
  $("pause").querySelector("small").textContent = off ? "зараз глухий і німий" : "глухий і німий";
}

function vitals(s) {
  const m = s.model || {};
  if (m.name) { $("name").textContent = m.name; document.title = m.name + " · heare"; }
  const box = $("model"); box.replaceChildren();
  if (m.error) box.append(el("b", "bad", "немає ключа жодної моделі"));
  else {
    box.append(el("b", "", m.provider || "?"), document.createTextNode(" · " + (m.model || "?")));
    if (m.fallback) box.append(el("div", "warn", `обрано ${m.wanted}, але в нього немає ключа`));
  }
  const hands = s.parts.executors.filter(n => n !== "screens");
  $("hands").replaceChildren(hands.length ? el("b", "ok", hands.join(" · ")) : el("span", "warn", "агентів не знайдено"));
  const t = s.session, mins = Math.round((Date.now() / 1000 - t.started) / 60);
  $("up").textContent = mins < 1 ? "щойно запущено" : mins < 60 ? `${mins} хв` : `${Math.floor(mins / 60)} год ${mins % 60} хв`;
  const cost = t.unpriced && !t.cost_usd ? "ціна невідома" : "$" + t.cost_usd.toFixed(4) + (t.unpriced ? " + невідомо" : "");
  $("session").textContent = `відповідей: ${t.turns} · ${cost}`;
}

function spark() {
  if (!speeds.length) return;
  const last = speeds[speeds.length - 1], sorted = [...speeds].sort((a, b) => a - b);
  $("speed").textContent = `${last.toFixed(1)} с · медіана ${sorted[Math.floor(sorted.length / 2)].toFixed(1)} с`;
  const max = Math.max(...speeds, 1), w = 70 / Math.max(speeds.length, 8);
  $("spark").innerHTML = speeds.map((v, i) => `<rect x="${i * w}" y="${16 - v / max * 15}" width="${Math.max(w - 1.5, 1)}" height="${v / max * 15}" fill="currentColor" opacity=".55"/>`).join("");
}

function tasks(list, permission) {
  const live = list.filter(t => t.status === "running" || Date.now() / 1000 - (t.ended || 0) < 180);
  $("tasks").replaceChildren(...(live.length ? live.reverse().map(t => {
    const row = el("div", "task"), what = el("div");
    what.append(el("p", "", t.request));
    const how = {running: t.step || "працює", done: "готово", failed: "не вдалося", stopped: "зупинено"}[t.status];
    const secs = Math.round((t.ended || Date.now() / 1000) - t.started);
    what.append(el("small", t.status === "failed" ? "bad" : "", [t.executor, how, secs + " с"].filter(Boolean).join(" · ")));
    row.append(what);
    if (t.status === "running") { const b = el("button", "mini", "зупинити"); b.onclick = () => api(`tasks/${t.id}/stop`, {method: "POST"}); row.append(b); }
    return row;
  }) : [el("p", "empty", "Зараз нічого не роблю.")]));
  $("ask").replaceChildren();
  if (permission) {
    const box = el("div", "ask");
    box.append(el("p", "", `${permission.executor} хоче: ${permission.what}`));
    const yes = el("button", "mini yes", "Так"), no = el("button", "mini", "Ні");
    yes.onclick = () => api(`permission/${permission.id}`, {method: "POST", body: {allow: true}});
    no.onclick = () => api(`permission/${permission.id}`, {method: "POST", body: {allow: false}});
    box.append(yes, no); $("ask").append(box);
  }
}

const refresh = () => api("state").then(s => {
  state = s; phase = s.phase; voice = s.controls.voice || null;
  show(); vitals(s); tasks(s.tasks, s.permission);
});

let shown = null;
function put(name) {
  shown = name;
  $("frame").src = "/screens/" + name + "?t=" + Date.now();
  $("frame").style.display = "block"; $("blank").style.display = "none";
  for (const c of $("screens").children) c.classList.toggle("on", c.textContent === name);
  try { localStorage.setItem("heare.canvas", name); } catch (e) {}
}
function screens(show) {
  return api("screens").then(names => {
    $("screens").replaceChildren(...names.map(n => {
      const b = el("button", "chip" + (n === shown ? " on" : ""), n);
      b.onclick = () => put(n);
      return b;
    }));
    let want = show;
    if (!want && !shown) { try { want = localStorage.getItem("heare.canvas"); } catch (e) {} }
    if (want && names.includes(want)) put(want);
  });
}

/* ── controls ── */
const turn = (name, value) => api("controls", {method: "POST", body: {part: "voice", name, value}}).then(v => { voice = v; show(); });
$("mic").onclick = () => turn("mic", !voice.mic);
$("speaker").onclick = () => turn("speaker", !voice.speaker);
$("volume").oninput = () => { $("volpct").textContent = Math.round($("volume").value * 100) + "%"; };
$("volume").onchange = () => turn("volume", Number($("volume").value));
$("listen").onclick = () => turn("listen", voice.listen === "name" ? "judge" : "name").then(refresh);
$("pause").onclick = () => { const on = !voice.mic && !voice.speaker; turn("mic", on).then(() => turn("speaker", on)); };
$("stop").onclick = () => api("stop", {method: "POST"}).then(() => aside("зупинено"));

/* ── settings ── */
const shut = () => { for (const id of ["veil", "settings"]) $(id).classList.remove("on"); };
$("veil").onclick = shut;
document.addEventListener("keydown", e => { if (e.key === "Escape") shut(); });
function keys() {
  api("keys").then(have => {
    const chosen = $("keyname").value;
    $("keyname").replaceChildren(...Object.keys(have).map(n => new Option((have[n] ? "✓ " : "— ") + n, n)));
    if (chosen) $("keyname").value = chosen;
  });
}
$("open-settings").onclick = () => {
  const m = (state && state.model) || {};
  $("provider").replaceChildren(...(m.providers || []).map(p => new Option(p, p)));
  $("provider").value = m.wanted || m.provider || "";
  api("settings").then(s => { $("modelname").value = s[$("provider").value + "_model"] || ""; $("provider").onchange = () => { $("modelname").value = s[$("provider").value + "_model"] || ""; }; });
  keys(); $("settings").classList.add("on"); $("veil").classList.add("on");
};
$("save-model").onclick = () => {
  const change = {llm_provider: $("provider").value};
  if ($("modelname").value.trim()) change[$("provider").value + "_model"] = $("modelname").value.trim();
  api("settings", {method: "POST", body: change})
    .then(() => { $("modelnote").textContent = "Збережено. Діє з наступної відповіді."; refresh(); })
    .catch(why => { $("modelnote").textContent = "Не збережено: " + why; });
};
$("save-key").onclick = () => {
  const name = $("keyname").value, value = $("keyvalue").value.trim();
  if (!value) return;
  $("keyvalue").value = "";
  api("keys", {method: "POST", body: {name, value}})
    .then(() => { $("keynote").textContent = `${name} збережено. Діє з наступної відповіді.`; keys(); refresh(); })
    .catch(why => { $("keynote").textContent = "Не збережено: " + why; });
};

/* ── live ── */
const stream = new EventSource("/api/events?token=" + encodeURIComponent(T));
stream.onmessage = m => {
  const e = JSON.parse(m.data);
  if (e.kind === "heard") { writing = null; askedAt = e.at; line(e.text, "me", e.channel); }
  else if (e.kind === "reply") { writing = writing || line("", "it"); writing.firstChild ? writing.firstChild.textContent += e.text : writing.append(e.text); $("talk").scrollTop = $("talk").scrollHeight; }
  else if (e.kind === "said") { if (!writing && e.text) line(e.text, "it", e.channel); writing = null; if (e.failed) aside("збій: " + e.failed); }
  else if (e.kind === "overheard") aside(`почув «${e.text}» — ${WHY[e.why] || "без імені, не відповідаю"}`);
  else if (e.kind === "phase") {
    phase = e.phase; show();
    if (e.phase === "speaking" && askedAt) { speeds.push(e.at - askedAt); if (speeds.length > 20) speeds.shift(); askedAt = null; spark(); }
  }
  else if (e.kind === "cannot") aside(`не можу: ${e.what} (${e.why})`);
  else if (e.kind === "screen") { screens(e.name); aside(`намалював: ${e.name}`); }
  else if (e.kind === "task") $("drawing").style.display = (e.executor === "screens" && e.status === "running") ? "block" : "none";
  if (["task", "permission", "permission_closed", "control", "usage", "said", "key", "halted"].includes(e.kind)) refresh();
};
stream.onerror = () => { $("dot").className = "off"; $("nowtext").textContent = "немає зв'язку з heare"; };

$("say").onsubmit = ev => { ev.preventDefault(); const text = $("text").value.trim(); if (!text) return; $("text").value = ""; api("message", {method: "POST", body: {text}}); };
refresh(); screens(); setInterval(refresh, 15000);
</script>
</html>
