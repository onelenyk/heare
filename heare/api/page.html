<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>heare</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1c1a; --soft:#77726a; --line:#e3dfd6; --accent:#2f6f5e; --warn:#a4541a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161513; --card:#1f1e1b; --ink:#ece8df; --soft:#99948a; --line:#33312c; --accent:#6fc2a9; --warn:#e0a060; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns: minmax(0,3fr) minmax(0,2fr); }
  @media (max-width: 760px) { main { grid-template-columns: minmax(0,1fr); } }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; min-width:0; }
  h2 { margin:0 0 10px; font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); }
  #phase { float:right; text-transform:none; letter-spacing:0; color:var(--accent); }
  #talk { height:46vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .line { max-width:85%; padding:8px 12px; border-radius:12px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .me { align-self:flex-end; background:var(--accent); color:var(--bg); }
  .it { align-self:flex-start; border:1px solid var(--line); }
  .via { display:block; font-size:11px; opacity:.7; }
  form { display:flex; gap:8px; margin-top:12px; }
  input, select, button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-width:0; }
  input { flex:1; }
  select { max-width:45%; }
  button { cursor:pointer; background:var(--accent); color:var(--bg); border-color:transparent; }
  button.quiet { background:transparent; color:var(--ink); border-color:var(--line); }
  .task { border-top:1px solid var(--line); padding:8px 0; display:flex; gap:8px; align-items:center; }
  .task:first-child { border-top:0; }
  .task div { flex:1; min-width:0; overflow-wrap:anywhere; }
  .task small { display:block; color:var(--soft); }
  .ask { border:1px solid var(--warn); border-radius:10px; padding:10px; margin-bottom:10px; }
  .ask p { margin:0 0 8px; }
  .empty { color:var(--soft); margin:0; }
  #screens a { display:inline-block; margin:0 8px 8px 0; color:var(--accent); }
  iframe { width:100%; height:50vh; border:1px solid var(--line); border-radius:8px; background:#fff; display:none; }
  .wide { grid-column: 1 / -1; }
</style>
<main>
  <section>
    <h2>Розмова <span id="phase"></span></h2>
    <div id="talk"></div>
    <form id="say"><input id="text" placeholder="Напиши heare…" autocomplete="off"><button>Надіслати</button></form>
  </section>
  <div style="display:grid; gap:16px; align-content:start; min-width:0">
    <section>
      <h2>Справи</h2>
      <div id="ask"></div>
      <div id="tasks"><p class="empty">Зараз нічого не робиться.</p></div>
    </section>
    <section>
      <h2>Ключ</h2>
      <form id="key"><select id="keyname"></select><input id="keyvalue" type="password" placeholder="встав токен" autocomplete="off"><button>Зберегти</button></form>
      <p class="empty" id="keynote"></p>
    </section>
  </div>
  <section class="wide">
    <h2>Твої екрани</h2>
    <div id="screens"><p class="empty">Ще жодного. Попроси heare зробити екран.</p></div>
    <iframe id="frame" title="екран"></iframe>
  </section>
</main>
<script>
const T = window.HEARE_TOKEN, $ = id => document.getElementById(id);
const api = (path, opts = {}) => fetch("/api/" + path, {
  ...opts, headers: {"X-Heare-Token": T, "Content-Type": "application/json"},
  body: opts.body ? JSON.stringify(opts.body) : undefined,
}).then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t)));
const PHASES = {idle: "", hearing: "слухає", thinking: "думає", speaking: "відповідає"};
const VIA = {voice: "голосом", text: "текстом", screen: ""};
let writing = null;

function line(text, who, via) {
  const el = document.createElement("div");
  el.className = "line " + who;
  el.textContent = text;
  if (VIA[via]) { const s = document.createElement("span"); s.className = "via"; s.textContent = VIA[via]; el.append(s); }
  $("talk").append(el); $("talk").scrollTop = $("talk").scrollHeight;
  return el;
}

function tasks(list, permission) {
  const live = list.filter(t => t.status === "running" || Date.now() / 1000 - (t.ended || 0) < 120);
  $("tasks").replaceChildren(...(live.length ? live.map(t => {
    const row = document.createElement("div"); row.className = "task";
    const what = document.createElement("div"); what.textContent = t.request;
    const about = document.createElement("small");
    about.textContent = [t.executor, {running: t.step || "працює", done: "готово", failed: "не вдалося", stopped: "зупинено"}[t.status]].filter(Boolean).join(" · ");
    what.append(about); row.append(what);
    if (t.status === "running") {
      const stop = document.createElement("button"); stop.className = "quiet"; stop.textContent = "Зупинити";
      stop.onclick = () => api(`tasks/${t.id}/stop`, {method: "POST"});
      row.append(stop);
    }
    return row;
  }) : [Object.assign(document.createElement("p"), {className: "empty", textContent: "Зараз нічого не робиться."})]));
  $("ask").replaceChildren();
  if (permission) {
    const box = document.createElement("div"); box.className = "ask";
    const p = document.createElement("p"); p.textContent = `${permission.executor} хоче: ${permission.what}`;
    const yes = document.createElement("button"); yes.textContent = "Так";
    const no = document.createElement("button"); no.className = "quiet"; no.textContent = "Ні"; no.style.marginLeft = "8px";
    yes.onclick = () => api(`permission/${permission.id}`, {method: "POST", body: {allow: true}});
    no.onclick = () => api(`permission/${permission.id}`, {method: "POST", body: {allow: false}});
    box.append(p, yes, no); $("ask").append(box);
  }
}

const refresh = () => api("state").then(s => { $("phase").textContent = PHASES[s.phase] || ""; tasks(s.tasks, s.permission); });

function screens() {
  api("screens").then(names => {
    if (!names.length) return;
    $("screens").replaceChildren(...names.map(n => {
      const a = document.createElement("a"); a.href = "#" + n; a.textContent = n;
      a.onclick = () => { $("frame").src = "/screens/" + n; $("frame").style.display = "block"; };
      return a;
    }));
  });
}

function keys() {
  api("keys").then(have => {
    const chosen = $("keyname").value;
    $("keyname").replaceChildren(...Object.keys(have).map(n => new Option((have[n] ? "✓ " : "") + n, n)));
    if (chosen) $("keyname").value = chosen;
  });
}

const stream = new EventSource("/api/events?token=" + encodeURIComponent(T));
stream.onmessage = m => {
  const e = JSON.parse(m.data);
  if (e.kind === "heard") { writing = null; line(e.text, "me", e.channel); }
  else if (e.kind === "reply") { writing = writing || line("", "it"); writing.textContent += e.text; $("talk").scrollTop = $("talk").scrollHeight; }
  else if (e.kind === "said") { if (!writing && e.text) line(e.text, "it", e.channel); writing = null; }
  else if (e.kind === "phase") $("phase").textContent = PHASES[e.phase] || "";
  else if (e.kind === "screen") screens();
  else if (e.kind === "key") keys();
  if (["task", "permission", "permission_closed"].includes(e.kind)) refresh();
};

$("say").onsubmit = ev => { ev.preventDefault(); const text = $("text").value.trim(); if (!text) return; $("text").value = ""; api("message", {method: "POST", body: {text}}); };
$("key").onsubmit = ev => {
  ev.preventDefault();
  const name = $("keyname").value, value = $("keyvalue").value.trim();
  if (!value) return;
  $("keyvalue").value = "";
  api("keys", {method: "POST", body: {name, value}})
    .then(() => { $("keynote").textContent = `${name} збережено. Діє з наступної відповіді.`; })
    .catch(why => { $("keynote").textContent = "Не збережено: " + why; });
};
refresh(); keys(); screens();
</script>
</html>
