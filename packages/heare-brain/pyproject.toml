[project]
name = "heare-brain"
version = "0.2.0"
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Shield-1.0.0"
dependencies = ["heare-core", "heare-reach", "heare-memory", "aiohttp>=3.13.5", "keyring>=25.7.0", "httpx>=0.27.0"]

[project.scripts]
heare-brain = "heare.brain:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heare"]
