[project]
name = "heare-sim"
version = "0.3.0"
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Shield-1.0.0"
dependencies = ["heare-core", "httpx>=0.27.0"]

[project.scripts]
heare-sim = "heare.sim:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heare"]
