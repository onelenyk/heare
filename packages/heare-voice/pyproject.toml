[project]
name = "heare-voice"
version = "0.2.0"
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Shield-1.0.0"
dependencies = ["heare-core", "edge-tts>=7.3.1", "sounddevice>=0.5.0", "pywebrtc-audio>=0.1.0", "numpy>=1.26"]

[project.scripts]
heare-voice = "heare.voice:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heare"]
