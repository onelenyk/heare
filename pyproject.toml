[project]
name = "heare"
version = "0.1.1"
description = "Proactive ambient voice AI assistant powered by Claude Code"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[groq,silero]>=0.0.50",
    "websockets>=12.0",
    "edge-tts>=7.0.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.5.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "textual>=1.0.0,<2.0.0",
    "aiohttp>=3.13.5",
]

[project.optional-dependencies]
local = [
    "pyaudio>=0.2.14",
]
memory = [
    "fastmcp>=2.14,<3",
]
# Speaker recognition runs on onnxruntime (no torch/speechbrain). The
# embedding model is fetched via scripts/fetch_speaker_onnx.py.
speaker = [
    "onnxruntime>=1.17",
    "numpy>=1.24",
    "huggingface-hub>=0.23",
]
audio-event = [
    "onnxruntime>=1.17",
    "numpy>=1.24",
]
overlay = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pywebview>=5",
    "pyobjc-core>=10; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-webkit>=10; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
