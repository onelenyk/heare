[project]
name = "heare"
version = "0.1.1"
description = "Proactive ambient voice AI assistant"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[groq,silero]>=0.0.50",
    "websockets>=12.0",
    "edge-tts>=7.0.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.5.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "aiohttp>=3.13.5",
    "pyaudio>=0.2.14",
    "pyinstaller>=6.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --tb=short"
filterwarnings = [
    "ignore::RuntimeWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/test_*", "tests/*", ".venv/*", "setup.py", "setup_directories.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
sort = "cover"
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
