[project]
name = "heare"
version = "0.1.1"
description = "Proactive ambient voice AI assistant"
requires-python = ">=3.11"
dependencies = [
    # The app as it stands: the door (aiohttp), reaching the model and the
    # parts (httpx), one file of memory (aiosqlite), the keys (keyring), and
    # the voice's own sound path (sounddevice, pywebrtc-audio, numpy) with
    # its speech (edge-tts).
    "aiohttp>=3.13.5",
    "aiosqlite>=0.20.0",
    "edge-tts>=7.0.0",
    "httpx>=0.27.0",
    "keyring>=25.7.0",
    "numpy>=1.26",
    "pywebrtc-audio>=0.1.0",
    "sounddevice>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `spine_live` leaves the machine — real Edge and DeepSeek, real cost. It is
# excluded here and run deliberately.
addopts = "--strict-markers --tb=short -m 'not spine_live'"
markers = [
    "spine_live: tests that leave the machine and cost money",
]
filterwarnings = [
    "ignore::RuntimeWarning",
]

[tool.coverage.run]
source = ["heare"]
omit = ["*/test_*", "tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
sort = "cover"
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heare"]
