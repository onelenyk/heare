[project]
name = "heare-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "heare-core",
    "heare-reach",
    "heare-eyes",
    "heare-voice",
    "heare-hands",
    "heare-chat",
    "heare-brain",
    "heare-memory",
    "heare-keeper",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
heare-core = { workspace = true }
heare-reach = { workspace = true }
heare-eyes = { workspace = true }
heare-voice = { workspace = true }
heare-hands = { workspace = true }
heare-chat = { workspace = true }
heare-brain = { workspace = true }
heare-memory = { workspace = true }
heare-keeper = { workspace = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `spine_live` leaves the machine — real Edge and DeepSeek, real cost. It is
# excluded here and run deliberately.
addopts = "--strict-markers --tb=short -m 'not spine_live'"
markers = [
    "spine_live: tests that leave the machine and cost money",
]
filterwarnings = [
    "ignore::RuntimeWarning",
]

[tool.coverage.run]
source = ["heare"]
omit = ["*/test_*", "tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
sort = "cover"
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
