[project]
name = "heare"
version = "0.1.1"
description = "Proactive ambient voice AI assistant"
requires-python = ">=3.11"
dependencies = [
    # The client the MCP bridge imports. It was never declared, so
    # src/agent/mcp_bridge.py raised ModuleNotFoundError on every
    # connection attempt — caught, logged, and indistinguishable from
    # "no servers configured". The constraint is the one pipecat's [mcp]
    # extra used, kept after pipecat itself went: we need the client,
    # not typer.
    "mcp>=1.11.0,<2",
    "websockets>=12.0",
    "edge-tts>=7.0.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.5.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "aiohttp>=3.13.5",
    "pyaudio>=0.2.14",
    "rumps>=0.4.0",
    "pywebrtc-audio>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    # A build tool, not something the app needs in order to run. It was
    # in the runtime list, which is also how it ended up inside the
    # bundle it produces.
    "pyinstaller>=6.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# E2E scenarios drive the whole daemon against real Groq, DeepSeek and
# Edge endpoints: minutes, not milliseconds, and they cost money. They
# are excluded here and run deliberately — `make e2e` or `pytest -m e2e`.
# `e2e` runs by default. It needs no network and no keys — the model is
# scripted at the module seam — and it costs twelve seconds. Excluded, it
# would rot: this directory sat empty for weeks with a marker pointing at
# it, which is the same shape as every other switch nobody read.
# `spine_live` stays out: that one costs money.
addopts = "--strict-markers --tb=short -m 'not spine_live'"
markers = [
    "e2e: the assembled app — real loop, real engine, real database, scripted model",
    "spine_live: acceptance tests hitting real Groq/DeepSeek/EdgeTTS",
]
filterwarnings = [
    "ignore::RuntimeWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/test_*", "tests/*", ".venv/*", "setup.py", "setup_directories.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
sort = "cover"
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
