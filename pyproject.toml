[project]
name = "heare"
version = "0.1.0"
description = "Proactive ambient voice AI assistant powered by Claude Code"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[groq,silero]>=0.0.50",
    "websockets>=12.0",
    "edge-tts>=7.0.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.5.0",
]

[project.optional-dependencies]
local = [
    "pyaudio>=0.2.14",
]
speaker = [
    "speechbrain>=1.0",
    "torch>=2.0",
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
