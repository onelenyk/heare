[project]
name = "heare"
version = "0.1.1"
description = "Proactive ambient voice AI assistant"
requires-python = ">=3.11"
dependencies = [
    # Upper bound is load-bearing: pipecat 1.0 removed OpenAILLMContext
    # (still imported here), dropped flat imports and replaced the
    # interruption system. Only the lockfile was holding us on 0.0.x, so
    # any `uv lock --upgrade` would have migrated us by accident.
    "pipecat-ai[groq,silero]>=0.0.108,<1.0",
    "websockets>=12.0",
    "edge-tts>=7.0.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.5.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "aiohttp>=3.13.5",
    "pyaudio>=0.2.14",
    "rumps>=0.4.0",
    "pywebrtc-audio>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    # A build tool, not something the app needs in order to run. It was
    # in the runtime list, which is also how it ended up inside the
    # bundle it produces.
    "pyinstaller>=6.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# E2E scenarios drive the whole daemon against real Groq, DeepSeek and
# Edge endpoints: minutes, not milliseconds, and they cost money. They
# are excluded here and run deliberately — `make e2e` or `pytest -m e2e`.
addopts = "--strict-markers --tb=short -m 'not e2e'"
markers = [
    "e2e: drives the assembled daemon end to end through a simulated room",
]
filterwarnings = [
    "ignore::RuntimeWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/test_*", "tests/*", ".venv/*", "setup.py", "setup_directories.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
sort = "cover"
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
