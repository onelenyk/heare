  const [bridgeRestartNotice, setBridgeRestartNotice] = useState(false);
  // Prompt Manager state
  const [showPrompts, setShowPrompts] = useState(false);
  const [prompts, setPrompts] = useState(null);
  const [selectedPrompt, setSelectedPrompt] = useState(null);
  const [preview, setPreview] = useState(null);
  const [editContent, setEditContent] = useState("");
  const bridgeIntervalRef = React.useRef(null);
  const [interruptEnabled, setInterruptEnabled] = useState(true);
  // Display widget state
  const [display, setDisplay] = useState(null);
  const [displayVisible, setDisplayVisible] = useState(true);
  const [displayFlash, setDisplayFlash] = useState(false);
  const [pollFailed, setPollFailed] = useState(false);
  const [historyTab, setHistoryTab] = useState("activity");
  const [agents, setAgents] = useState([]);
  const [showAgents, setShowAgents] = useState(false);

  useEffect(() => {
    if (logRef.current) {
      const el = logRef.current;
      const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30;
      if (atBottom) el.scrollTop = el.scrollHeight;
    }
  }, [logs]);

  useEffect(() => {
    poll();
    const t = setInterval(poll, 1000);
    return () => clearInterval(t);
  }, []);

  async function poll() {
    try {
      const [sr, ar, lr, dr] = await Promise.all([
        fetch(API + "/state"),
        fetch(API + "/activity"),
        fetch(API + "/logs"),
        fetch(API + "/display"),
      ]);
      const [sData, aData, lData, dData] = await Promise.all([sr.json(), ar.json(), lr.json(), dr.json()]);
      setState(sData);
      setInterruptEnabled(sData.interrupt_enabled !== false);
      setActivity(aData);
      setLogs(lData.lines || []);
      if (dData && dData.content) {
        setDisplay(prev => {
          if (!prev || prev.ts !== dData.ts) {
            setDisplayFlash(true);
            setTimeout(() => setDisplayFlash(false), 1200);
            setDisplayVisible(true);
          }
          return dData;
        });
      }
      // Agents poll
      fetch(API + "/api/agents").then(r => r.json()).then(d => {
        setAgents(d.agents || []);
      }).catch(() => {});
      setPollFailed(false);
    } catch(e) {
      setPollFailed(true);
    }
  }

  async function post(url, body) {
    await fetch(API + url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  }

  async function saveSettings() {
    const g = document.getElementById("set-groq").value;
    const d = document.getElementById("set-deepseek").value;
    if (g || d) {
      await fetch(API + "/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ groq_api_key: g, deepseek_api_key: d }),
      });
    }
    setShowSettings(false);
  }

  function showToastMsg(msg, type) {
    setToast({ msg, type: type || "ok" });
  }

  // ═══ 4c: Text injection ═══
  async function handleInject() {
    if (!injectText.trim()) return;
    try {
      const r = await fetch(API + "/inject", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: injectText.trim() }),
      });
      const d = await r.json();
      if (d.ok) { showToastMsg("injected!", "ok"); setInjectText(""); }
      else showToastMsg("inject failed: " + (d.error || "unknown"), "err");
    } catch(e) { showToastMsg("inject failed: " + e.message, "err"); }
  }

  // ═══ 4d: Daemon lifecycle ═══
  async function handleDaemonAction(action) {
    try {
      if (action === "start" || action === "restart") { showToastMsg("starting...", "info"); }
      await fetch(API + "/daemon", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action }),
      });
      poll();
    } catch(e) { showToastMsg(action + " failed: " + e.message, "err"); }
  }

  // ═══ 4e: Audio devices ═══
  async function fetchAudioDevices() {
    try {
      const r = await fetch(API + "/api/audio-devices");
      const d = await r.json();
      setAudioDevices(d);
      setShowAudio(true);
    } catch(e) { showToastMsg("audio fetch failed: " + e.message, "err"); }
  }

  async function handleDeviceSelect(sel) {
    try {
      const r = await fetch(API + "/api/audio-devices/select", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(sel),
      });
      const d = await r.json();
      if (d.ok) { showToastMsg(d.kind + ": " + d.device, "ok"); poll(); }
      else showToastMsg("device select failed: " + (d.error || ""), "err");
    } catch(e) { showToastMsg("device select failed: " + e.message, "err"); }
  }

  // ═══ 4f: Chrome launch + profile picker ═══
  async function fetchChromeProfiles() {
    try {
      const r = await fetch(API + "/api/chrome/profiles");
      const d = await r.json();
      const profiles = d.profiles || [];
      setChromeProfiles(profiles);
      if (profiles.length > 0) {
        const lastUsed = profiles.find(p => p.last_used) || profiles[0];
        setChromeProfile(lastUsed.directory);
      }
    } catch(e) { showToastMsg("profiles fetch failed: " + e.message, "err"); }
  }

  async function handleAgentCancel(sid) {
    try {
      await fetch(API + "/api/agents/cancel", { 
        method: "POST", 
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({session_id: sid}) 
      });
      showToastMsg("agent cancelled", "ok");
    } catch(e) { showToastMsg("cancel failed: " + e.message, "err"); }
  }

  async function handleChromeLaunch() {
    try {
      const body = chromeProfile ? { profile_directory: chromeProfile } : {};
      const r = await fetch(API + "/api/chrome/launch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const d = await r.json();
      if (d.ok) showToastMsg(d.status, "ok");
      else showToastMsg("chrome launch failed: " + (d.status || ""), "err");
    } catch(e) { showToastMsg("chrome launch failed: " + e.message, "err"); }
  }

  // ═══ 4g: Tools ═══
  async function handleOpenTools() {
    try {
      const r = await fetch(API + "/api/tools");
      const d = await r.json();
      setToolsData(d);
    } catch(e) { setToolsData({ error: e.message, built_in: [], skills: [], mcps: [] }); }
    setShowTools(true);
  }

  // ═══ Prompt Manager ═══
  async function handleOpenPrompts() {
    setShowPrompts(true);
    const r = await fetch(API + "/api/prompts");
    setPrompts(await r.json());
  }
  async function handlePromptEdit(key) {
    const r = await fetch(API + "/api/prompts/" + key);
    const d = await r.json();
    setSelectedPrompt(d);
    setEditContent(d.content || "");
  }
  async function handlePromptPreview() {
    const r = await fetch(API + "/api/prompts/preview");
    setPreview(await r.text());
  }
  async function handlePromptSave() {
    if (!selectedPrompt) return;
    const r = await fetch(API + "/api/prompts/" + selectedPrompt.key, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({content: editContent}),
    });
    const d = await r.json();
    if (d.ok) showToastMsg("saved (" + d.char_count + " chars)", "ok");
    else showToastMsg("save failed: " + (d.error || "unknown"), "err");
  }
  async function handlePromptClose() {
    setShowPrompts(false);
    setSelectedPrompt(null);
    setPreview(null);
  }

  // ═══ Bridge setup ═══
  async function fetchBridgeStatus() {
    try {
      const r = await fetch(API + "/api/bridge/status");
      const d = await r.json();
      // Compute token_hint from has_token (masked display)
      if (d.has_token) {
        // The full token isn't returned from /status for security;
        // we'll just store a hint for the masked display.
        d.token_hint = d.has_token ? "••••••••" : null;
      }
      setBridge(d);
    } catch(e) {
      setBridge({ enabled: false, connected: false, has_token: false, error: e.message });
    }
  }

  async function openBridgeSetup() {
    setBridgeRevealing(false);
    setBridgeRestartNotice(false);
    await fetchBridgeStatus();
    setShowBridge(true);
  }

  function closeBridgeSetup() {
    if (bridgeIntervalRef.current) { clearInterval(bridgeIntervalRef.current); bridgeIntervalRef.current = null; }
    setShowBridge(false);
    setBridge(null);
  }

  useEffect(() => {
    if (!showBridge) {
      if (bridgeIntervalRef.current) { clearInterval(bridgeIntervalRef.current); bridgeIntervalRef.current = null; }
      return;
    }
    fetchBridgeStatus();
    bridgeIntervalRef.current = setInterval(fetchBridgeStatus, 3000);
    return () => {
      if (bridgeIntervalRef.current) { clearInterval(bridgeIntervalRef.current); bridgeIntervalRef.current = null; }
    };
  }, [showBridge]);

  async function handleBridgeRotate() {
    if (!confirm("This will invalidate the current token. Continue?")) return;
    try {
      const r = await fetch(API + "/api/bridge/rotate-token", { method: "POST" });
      const d = await r.json();
      if (d.ok) {
        setBridgeRestartNotice(true);
        showToastMsg("new token generated (restart required): " + d.token, "ok");
        fetchBridgeStatus();
      } else {
        showToastMsg("rotate failed: " + (d.error || ""), "err");
      }
    } catch(e) { showToastMsg("rotate failed: " + e.message, "err"); }
  }

  async function handleBridgeToggle(currentEnabled) {
    const newEnabled = !currentEnabled;
    try {
      const r = await fetch(API + "/api/bridge/toggle", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled: newEnabled }),
      });
      const d = await r.json();
      if (d.ok) {
        setBridgeRestartNotice(true);
        showToastMsg("bridge " + (newEnabled ? "enabled" : "disabled") + " (restart required)", "ok");
        fetchBridgeStatus();
      } else {
        showToastMsg("toggle failed: " + (d.error || ""), "err");
      }
    } catch(e) { showToastMsg("toggle failed: " + e.message, "err"); }
  }

  const running = state.running === true;

  return (
    <div class="dash">
      {/* Status Bar */}
      <div class="status-bar">
        <span class={"dot " + (running ? "on" : "off")}></span>
        <span class="identity">{state.agent || "heare"} {state.emoji || ""}</span>
        <span class="meta">{running ? "running" : "stopped"}</span>
        {state.pid != null && <span class="meta">pid=<strong>{state.pid}</strong></span>}
        {state.uptime != null && state.uptime !== "" && <span class="meta">{state.uptime}</span>}
        <span class="meta">chrome:<strong>{state.chrome ? "connected" : "off"}</strong></span>
        {state.version && <span class="meta">{state.version}</span>}
        <span class="meta">mode <strong>{state.mode || "?"}</strong></span>
        <span class="meta">
          provider{" "}
          <select class="compact-select" value={state.provider || ""} onChange={e => { post("/provider", {provider: e.target.value}); }}>
            {(state.providers || []).map(p => <option key={p} value={p}>{p}</option>)}
          </select>
        </span>
        <span class="meta">
          model{" "}
          <select class="compact-select" value={state.model || ""} onChange={e => { post("/model", {model: e.target.value}); }}>
            {(state.models || []).map(m => <option key={m} value={m}>{m}</option>)}
          </select>
        </span>
        <span class="meta">{state.transcripts_count || 0} msgs</span>
        <span class="meta">interrupt:<strong>{interruptEnabled ? "on" : "off"}</strong></span>
        {state.usage && (
          <span class="meta">llm:{state.usage.llm_calls || 0} ${(state.usage.total_cost_usd || 0).toFixed(4)}</span>
        )}
      </div>

      {pollFailed && <div class="warn-banner">⚠ connection lost — data may be stale</div>}

      {/* Voice & Agent status bars */}
      <div class="viz-row">
        <div class="viz-col">
          <div class="bar-section-label">🎤 you</div>
          <UserVoiceBar voiceState={state.voice_state} />
        </div>
        <div class="viz-col">
          <div class="bar-section-label">🤖 agent</div>
          <AgentStatusBar agentState={state.agent_state} />
        </div>
      </div>

      {/* Display widget — renders show_text / show_canvas output */}
      {display && display.content && displayVisible && (
        <div className={`display-card${displayFlash ? ' flash' : ''}`}>
          <div className="display-header">
            <span className="display-icon">{display.format === 'html' ? '📺' : '📄'}</span>
            <span className="display-fmt">{display.format}</span>
            {display.title && <span className="display-title">{display.title}</span>}
            <span className="display-ts">{new Date(display.ts * 1000).toLocaleTimeString()}</span>
            <button className="display-dismiss" onClick={() => setDisplayVisible(false)}>✕</button>
          </div>
          <div className="display-content">
            {display.format === 'text' && <pre className="display-text">{display.content}</pre>}
            {display.format === 'code' && <pre className="display-code"><code>{display.content}</code></pre>}
            {(display.format === 'ascii' || display.format === 'table') && <pre className="display-mono">{display.content}</pre>}
            {display.format === 'markdown' && <pre className="display-md">{display.content}</pre>}
            {display.format === 'html' && <iframe sandbox="" srcDoc={display.content} className="display-html" />}
          </div>
        </div>
      )}

      {/* Controls */}
      <div class="card">
        {state.last_response && (
          <div class="response-line">{state.last_response}</div>
        )}
        <div class="card-header">controls</div>
        {/* Mode buttons */}
        <div class="controls-group">
          {["silent","focus","ambient","assistant"].map(m =>
            <button key={m} class={"btn" + (state.mode === m ? " active" : "")} onClick={() => post("/mode", {mode: m})}>{m}</button>
          )}
        </div>
        <div class="controls-sep"></div>
        {/* Audio controls */}
        <div class="controls-group">
          <button class="btn" onClick={() => post("/mute", {target: "mic"})}>{state.mute_mic === "1" || state.mute_mic === true ? "🔇 mute mic" : "🎤 mic on"}</button>
          <button class="btn" onClick={() => post("/mute", {target: "bot"})}>{state.mute_bot === "1" || state.mute_bot === true ? "🔇 mute bot" : "🔊 bot on"}</button>
          <button class="btn" onClick={() => post("/cancel", {})}>⏹ cancel</button>
          <button class="btn"
            onClick={async () => {
              const newValue = !interruptEnabled;
              const r = await fetch(API + "/interrupt", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({enabled: newValue}),
              });
              const d = await r.json();
              if (d.ok) {
                setInterruptEnabled(d.enabled);
                showToastMsg(d.enabled ? "interrupt on — voice breaks bot" : "interrupt off — bot finishes speaking", "ok");
              }
            }}
          >{interruptEnabled ? "🗣 interrupt: on" : "🤐 interrupt: off"}</button>
        </div>
        <div class="controls-sep"></div>
        {/* Daemon lifecycle */}
        <div class="controls-group">
          {!running && !state.starting && <button class="btn" onClick={() => handleDaemonAction("start")}>▶ start</button>}
          {running && <button class="btn danger" onClick={() => handleDaemonAction("stop")}>■ stop</button>}
          {running && <button class="btn" onClick={() => handleDaemonAction("restart")}>↻ restart</button>}
          {!running && state.starting && <span class="info-line" style={{color:"var(--accent)"}}>starting…</span>}
        </div>
        <div class="controls-sep"></div>
        {/* Configuration tools */}
        <div class="controls-group">
          <button class="btn" onClick={() => setShowSettings(!showSettings)}>⚙ settings</button>
          <button class="btn" onClick={fetchAudioDevices}>🎧 audio</button>
          <button class="btn" onClick={fetchChromeProfiles}>🌐 chrome</button>
          <button class="btn" onClick={handleOpenTools}>🔧 tools</button>
          <button class="btn" onClick={openBridgeSetup}>🌉 bridge</button>
          <button class="btn" onClick={handleOpenPrompts}>📝 prompts</button>
          <button class={"btn" + (showAgents ? " active" : "")} onClick={() => setShowAgents(!showAgents)}>🤖 agents</button>
        </div>
        <div class="controls-sep"></div>
        {/* Text injection */}
        <div class="controls-group">
          <input
            type="text" value={injectText}
            onInput={e => setInjectText(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") handleInject(); }}
            placeholder="text to inject…"
            class="mono-input"
          />
          <button class="btn" onClick={handleInject}>send</button>
        </div>
        {/* Chrome profile picker */}
        {chromeProfiles !== null && (
          <div class="controls-group" style={{marginTop:4}}>
            {chromeProfiles.length > 0 && (
              <select value={chromeProfile} onChange={e => setChromeProfile(e.target.value)}
                style={{flex:1,minWidth:0,background:"var(--bg)",color:"var(--text)",border:"1px solid var(--border)",padding:"3px 6px",fontSize:11,borderRadius:4}}>
                {chromeProfiles.map(p => <option key={p.directory} value={p.directory}>{p.display_name}{p.last_used ? " (last)" : ""}</option>)}
              </select>
            )}
            <button class="btn" onClick={handleChromeLaunch}>launch chrome</button>
            <button class="btn" onClick={() => setChromeProfiles(null)}>✕</button>
          </div>
        )}
      </div>

      {/* Settings Panel */}
      {showSettings && (
        <div class="card">
          <div class="card-header">⚙ settings</div>
          <div class="settings-panel">
             <div><label style={{fontSize:11,color:"var(--muted)"}}>Groq API Key {state.key_groq_api_key && <span style={{color:"var(--accent)"}}>✓</span>}</label><input id="set-groq" type="password" placeholder="gsk_..." /></div>
            <div><label style={{fontSize:11,color:"var(--muted)"}}>DeepSeek API Key {state.key_deepseek_api_key && <span style={{color:"var(--accent)"}}>✓</span>}</label><input id="set-deepseek" type="password" placeholder="sk-..." /></div>
          </div>
          <div style={{padding:"0 8px 8px"}}>
            <button class="btn primary" onClick={saveSettings} style={{width:"100%",fontSize:12}}>Save & Apply</button>
          </div>
        </div>
      )}

      {/* Agent management */}
      {showAgents && (
      <div class="card">
        <div class="card-header">{"🤖"} agents ({agents.length})</div>
        <AgentLauncher onStart={poll} onToast={showToastMsg} />
        <AgentList agents={agents} onCancel={handleAgentCancel} onToast={showToastMsg} />
      </div>
      )}

      {/* History panel */}
      <div class="card">
        <div class="card-header" style={{display:"flex",alignItems:"center"}}>
          <span style={{flex:1}}>history</span>
          <button class={"history-tab-btn" + (historyTab === "activity" ? " active" : "")} onClick={() => setHistoryTab("activity")}>activity ({activity.length})</button>
          <button class={"history-tab-btn" + (historyTab === "logs" ? " active" : "")} onClick={() => setHistoryTab("logs")}>logs ({logs.length})</button>
        </div>
        {historyTab === "activity" ? (
          <div class="scroll">
            <table>
              <thead><tr><th>time</th><th>who</th><th>content</th></tr></thead>
              <tbody>
                {activity.length === 0 ? (
                  <tr><td colspan="3" style={{textAlign:"center",color:"var(--muted)",padding:"24px 12px",fontSize:13}}>No activity yet — start speaking</td></tr>
                ) : activity.map((row, i) => (
                  <tr key={i}>
                    <td class="cell-muted" style={{width:56}}>{new Date(row.ts * 1000).toTimeString().slice(0,8)}</td>
                    <td class={row.who === "bot" ? "cell-bot" : "cell-you"} style={{width:36}}>{row.who}</td>
                    <td style={{overflow:"hidden",textOverflow:"ellipsis"}}>{(row.content || "").substring(0, 80)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ) : (
          <div class="scroll" style={{maxHeight:240}} ref={logRef}>
            <table>
              <tbody>
                {logs.length === 0 ? (
                  <tr><td style={{textAlign:"center",color:"var(--muted)",padding:"16px 12px",fontSize:12}}>Daemon log lines appear here</td></tr>
                ) : logs.map((line, i) => (
                  <tr key={i}><td style={{whiteSpace:"pre-wrap",wordBreak:"break-all",fontSize:11,color: line.toUpperCase().includes("ERROR") ? "var(--accent-red)" : line.toUpperCase().includes("WARN") ? "var(--accent-yellow)" : "var(--muted)"}}>{line}</td></tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {/* 4e: Audio device picker */}
      {showAudio && (
        <AudioDevicePicker
          devices={audioDevices ? audioDevices.devices : null}
          activeInput={audioDevices ? audioDevices.active_input : null}
          activeOutput={audioDevices ? audioDevices.active_output : null}
          onSelect={handleDeviceSelect}
          onClose={() => setShowAudio(false)}
        />
      )}

      {/* 4g: Tools modal */}
      {showTools && <ToolsModal data={toolsData} onClose={() => setShowTools(false)} />}

      {/* Bridge setup modal */}
      {showBridge && (
        <BridgeModal
          data={bridge ? {...bridge, restart_notice: bridgeRestartNotice} : null}
          onClose={closeBridgeSetup}
          onRotate={handleBridgeRotate}
          onToggle={handleBridgeToggle}
          revealToken={bridgeRevealing}
          onToggleReveal={() => setBridgeRevealing(!bridgeRevealing)}
          onToast={showToastMsg}
        />
      )}

      {/* Prompt Manager modal */}
      {showPrompts && (
        <PromptManager
          prompts={prompts}
          selectedPrompt={selectedPrompt}
          editContent={editContent}
          preview={preview}
          onSelect={handlePromptEdit}
          onPreview={handlePromptPreview}
          onSave={handlePromptSave}
          onClose={handlePromptClose}
          onEditContent={setEditContent}
        />
      )}

      {/* Toast */}
      {toast && <Toast message={toast.msg} type={toast.type} onDismiss={() => setToast(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
