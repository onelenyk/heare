<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heare</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #21262d;
    --text: #c9d1d9; --muted: #8b949e; --accent: #7ee787;
    --accent-red: #ff7b72; --accent-cyan: #79c0ff;
    --accent-orange: #ffa657; --accent-yellow: #e3b341;
    --sans: -apple-system,'Segoe UI',system-ui,sans-serif;
    --mono: 'SF Mono',monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5; }
  input, select, button { font-family: var(--sans); }
  .btn {
    padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--card); color: var(--text); cursor: pointer;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .btn:hover { border-color: #30363d; background: #1c2128; }
  .btn.active { border-color: var(--accent); color: var(--accent); }
  .btn.danger { border-color: #3a1f1f; }
  .btn.danger:hover { background: #2a1515; }
  .btn.primary { background: var(--accent); color: #000; border: none; font-weight: 700; padding: 8px 20px; font-size: 14px; }

  /* Onboarding */
  .onboard-wrap {
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
  }
  .onboard-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 32px; max-width: 480px; width: 100%;
  }
  .onboard-card h1 { font-size: 48px; font-weight: 800; text-align: center; margin-bottom: 8px; letter-spacing: -1px; }
  .onboard-card .sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  .field input, .field select {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); padding: 10px 12px; font-size: 14px;
    border-radius: 6px; font-family: var(--mono);
  }
  .field input:focus, .field select:focus { border-color: var(--accent-cyan); outline: none; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .hint a { color: var(--accent-cyan); }
  .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .status-msg { text-align: center; margin-top: 12px; font-size: 13px; font-family: var(--mono); min-height: 20px; }
  .status-msg.ok { color: var(--accent); }
  .status-msg.err { color: var(--accent-red); }
  .features { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
  .features div { font-size: 12px; color: var(--muted); padding: 8px; background: var(--bg); border-radius: 6px; text-align: center; }
  .features strong { color: var(--text); display: block; margin-bottom: 2px; font-size: 13px; }

  /* Dashboard */
  .dash { padding: 8px; min-width: 520px; }
  .status-bar {
    border-bottom: 2px solid var(--border); margin-bottom: 8px;
    padding: 3px 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .dot.off { background: var(--accent-red); }
  .identity { font-weight: 700; font-size: 18px; }
  .meta { color: var(--muted); font-size: 11px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; margin-bottom: 6px;
  }
  .card-header {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); margin-bottom: 6px;
  }
  .row { display: flex; gap: 6px; }
  .col { flex: 1; min-width: 0; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 4px; }
  .response { font-size: 16px; font-weight: 600; color: var(--accent-orange); padding: 4px 0; }
  .info-line { font-family: var(--mono); font-size: 11px; margin-bottom: 2px; color: var(--muted); }
  .info-line strong { color: var(--accent-cyan); font-weight: 400; }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px; }
  th { text-align: left; color: var(--muted); font-weight: 700; padding: 2px 6px; border-bottom: 1px solid var(--border); font-size: 10px; text-transform: uppercase; }
  td { padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--border); }
  .scroll { max-height: 240px; overflow-y: auto; }
  .settings-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
  .settings-panel input, .settings-panel select {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); padding: 4px 8px; font-size: 12px;
    border-radius: 4px; margin-top: 2px;
  }

  /* Voice Activity Bars */
  .voice-bar, .agent-bar {
    height: 8px; border-radius: 4px; width: 100%;
    transition: all 0.3s ease;
  }
  .bar-label { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .bar-sub { font-size: 10px; color: var(--muted); margin-top: 2px; opacity: 0.7; }

  /* Voice bar states */
  .voice-idle { background: var(--muted); opacity: 0.3; }
  .voice-listening { background: #7ee787; animation: pulse 1.2s ease-in-out infinite; }
  .voice-result { background: #79c0ff; }
  .voice-stt {
    background: linear-gradient(90deg, #e3b341 25%, #f0d060 50%, #e3b341 75%);
    background-size: 200% 100%;
    animation: wave 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scaleY(1); }
    50% { opacity: 0.6; transform: scaleY(0.75); }
  }
  @keyframes wave {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Agent bar states */
  .agent-idle { background: var(--muted); opacity: 0.3; }
  .agent-talking { background: #ffa657; animation: fill 0.5s ease-out forwards; }
  .agent-interrupted { background: #ff7b72; animation: flash 0.4s ease-in-out 3; }

  @keyframes fill {
    0% { width: 0%; }
    100% { width: 100%; }
  }
  @keyframes flash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .viz-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .viz-col { flex: 1; min-width: 0; }
  .bar-section-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); margin-bottom: 4px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
const API = "http://127.0.0.1:9778";

// ── App ──
function App() {
  const [view, setView] = useState("loading");

  useEffect(() => {
    checkStatus();
    const t = setInterval(checkStatus, 2000);
    return () => clearInterval(t);
  }, []);

  async function checkStatus() {
    try {
      const r = await fetch(API + "/settings/status");
      const s = await r.json();
      setView(s.configured ? "dashboard" : "onboarding");
    } catch(e) {
      setView("loading");
    }
  }

  async function onKeysSaved() {
    // Poll until daemon detects keys and serves dashboard
    for (let i = 0; i < 30; i++) {
      await new Promise(r => setTimeout(r, 1000));
      try {
        const r = await fetch(API + "/settings/status");
        const s = await r.json();
        if (s.configured) { setView("dashboard"); return; }
      } catch(e) {}
    }
    setView("dashboard"); // fallback
  }

  if (view === "loading") {
    return <PermissionsGate onReady={() => setView("dashboard")} />;
  }
  if (view === "onboarding") {
    return <Onboarding onSaved={onKeysSaved} />;
  }
  return <Dashboard />;
}

// ── Permissions Gate ──
function PermissionsGate({ onReady }) {
  const [micOk, setMicOk] = useState(null);

  useEffect(() => {
    checkMic();
    const t = setInterval(checkMic, 2000);
    return () => clearInterval(t);
  }, []);

  async function checkMic() {
    try {
      const r = await fetch(API + "/mic/status");
      const d = await r.json();
      setMicOk(d.mic_available);
      if (d.mic_available) onReady();
    } catch(e) {
      setMicOk(null);
    }
  }

  if (micOk === null) {
    return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",color:"var(--muted)",fontSize:18}}>Connecting to Heare…</div>;
  }

  if (!micOk) {
    return (
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:20}}>
        <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:32,maxWidth:480,width:"100%",textAlign:"center"}}>
          <div style={{fontSize:48,marginBottom:16}}>🎤</div>
          <h2 style={{marginBottom:8}}>Microphone Access Required</h2>
          <p style={{color:"var(--muted)",marginBottom:20,lineHeight:1.6}}>
            Heare needs microphone access to hear you.<br/>
            Open <strong>System Settings → Privacy & Security → Microphone</strong><br/>
            and enable Heare.
          </p>
          <p style={{color:"var(--accent)",fontSize:14}}>Waiting for permission…</p>
        </div>
      </div>
    );
  }

  return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",color:"var(--muted)",fontSize:18}}>Loading…</div>;
}

// ── Onboarding ──
function Onboarding({ onSaved }) {
  const [groq, setGroq] = useState("");
  const [llm, setLlm] = useState("");
  const [provider, setProvider] = useState("deepseek_api_key");
  const [lang, setLang] = useState("en");
  const [voice, setVoice] = useState("en-US-AriaNeural");
  const [status, setStatus] = useState("");
  const [saving, setSaving] = useState(false);

  const PROVIDER_NAMES = {
    deepseek_api_key: "DEEPSEEK_API_KEY",
    openrouter: "OPENROUTER_API_KEY",
    zai: "ZAI_API_KEY",
    opencode: "OPENCODE_API_KEY"
  };

  async function handleSubmit(e) {
    e.preventDefault();
    if (!groq.trim() && !llm.trim()) {
      setStatus("At least one API key is required");
      return;
    }
    setSaving(true);
    setStatus("Saving…");
    try {
      const body = {
        groq_api_key: groq.trim(),
        language: lang,
        tts_voice: voice,
      };
      body[provider] = llm.trim();
      const r = await fetch(API + "/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const d = await r.json();
      if (!d.ok) {
        setStatus(d.errors ? d.errors.join(". ") : "Failed to save settings");
        setSaving(false);
        return;
      }
      setStatus("Keys saved! Starting daemon…");
      setTimeout(() => onSaved(), 1000);
    } catch(e) {
      setStatus("Failed to save — is the daemon running?");
      setSaving(false);
    }
  }

  return (
    <div class="onboard-wrap">
      <form class="onboard-card" onSubmit={handleSubmit}>
        <h1>heare</h1>
        <div class="sub">Proactive ambient voice AI assistant</div>

        <div class="field">
          <label>Groq API Key (Speech-to-Text)</label>
          <input type="password" value={groq} onInput={e => setGroq(e.target.value)} placeholder="gsk_..." autoFocus />
          <div class="hint"><a href="https://console.groq.com/keys" target="_blank">Get a free key →</a></div>
        </div>

        <div class="field">
          <label>LLM API Key</label>
          <input type="password" value={llm} onInput={e => setLlm(e.target.value)} placeholder="sk-..." />
          <div class="hint">
            <select value={provider} onChange={e => setProvider(e.target.value)} style={{width:"auto",background:"var(--bg)",color:"var(--text)",border:"1px solid var(--border)",padding:"2px 6px",fontSize:11,borderRadius:3}}>
              <option value="deepseek_api_key">DeepSeek</option>
              <option value="openrouter">OpenRouter</option>
              <option value="zai">z.ai</option>
              <option value="opencode">OpenCode</option>
            </select>
          </div>
        </div>

        <hr class="divider" />

        <div class="field">
          <label>Language</label>
          <select value={lang} onChange={e => setLang(e.target.value)}>
            <option value="uk">Ukrainian</option>
            <option value="en">English</option>
            <option value="ru">Russian</option>
          </select>
        </div>

        <div class="field">
          <label>Voice</label>
          <select value={voice} onChange={e => setVoice(e.target.value)}>
            <option value="en-US-AriaNeural">en-US-AriaNeural</option>
            <option value="uk-UA-OstapNeural">uk-UA-OstapNeural (male)</option>
            <option value="uk-UA-PolinaNeural">uk-UA-PolinaNeural (female)</option>
            <option value="ru-RU-SvetlanaNeural">ru-RU-SvetlanaNeural</option>
          </select>
        </div>

        <button type="submit" class="btn primary" disabled={saving} style={{width:"100%"}}>
          {saving ? "Saving…" : "Save & Start Heare"}
        </button>
        <div class={"status-msg " + (status.includes("Failed") ? "err" : "ok")}>{status}</div>

        <div class="features">
          <div><strong>🎤 Always listening</strong>VAD-gated</div>
          <div><strong>🧠 Claude-powered</strong>Autonomous</div>
          <div><strong>🌐 Browser control</strong>Chrome bridge</div>
          <div><strong>🔧 Dev tools</strong>Bash, files, web</div>
        </div>
      </form>
    </div>
  );
}

// ── UserVoiceBar ──
function UserVoiceBar({ voiceState }) {
  const [effectiveState, setEffectiveState] = useState("idle");
  const sinceRef = useRef(0);

  useEffect(() => {
    if (!voiceState) return;
    sinceRef.current = voiceState.since_ts || 0;
    setEffectiveState(voiceState.state || "idle");
  }, [voiceState]);

  // Auto-decay "result" to idle after 4s
  useEffect(() => {
    if (effectiveState !== "result") return;
    const elapsed = (Date.now() / 1000) - sinceRef.current;
    const remaining = Math.max(0, 4000 - elapsed * 1000);
    if (remaining <= 0) { setEffectiveState("idle"); return; }
    const t = setTimeout(() => setEffectiveState("idle"), remaining);
    return () => clearTimeout(t);
  }, [effectiveState]);

  const labels = {
    idle: "\u25cb idle",
    listening: "\u25cf listening",
    stt: "\u25d0 transcribing",
    result: "\u2713 result"
  };
  const subs = {
    idle: "(no audio)",
    listening: "(speak now)",
    stt: voiceState?.last_partial ? voiceState.last_partial.substring(0, 40) : "(processing...)",
    result: voiceState?.last_final ? voiceState.last_final.substring(0, 40) : ""
  };

  return (
    <div>
      <div class="bar-label">{labels[effectiveState] || "\u25cb idle"}</div>
      <div class={"voice-bar voice-" + effectiveState}></div>
      <div class="bar-sub">{subs[effectiveState] || ""}</div>
    </div>
  );
}

// ── AgentStatusBar ──
function AgentStatusBar({ agentState }) {
  const [effectiveState, setEffectiveState] = useState("idle");
  const sinceRef = useRef(0);

  useEffect(() => {
    if (!agentState) return;
    sinceRef.current = agentState.since_ts || 0;
    setEffectiveState(agentState.state || "idle");
  }, [agentState]);

  // Auto-decay "interrupted" to idle after 4s
  useEffect(() => {
    if (effectiveState !== "interrupted") return;
    const elapsed = (Date.now() / 1000) - sinceRef.current;
    const remaining = Math.max(0, 4000 - elapsed * 1000);
    if (remaining <= 0) { setEffectiveState("idle"); return; }
    const t = setTimeout(() => setEffectiveState("idle"), remaining);
    return () => clearTimeout(t);
  }, [effectiveState]);

  const labels = {
    idle: "\u25cb idle",
    talking: "\u25cf talking",
    interrupted: "\u26a1 interrupted"
  };
  const subs = {
    idle: "(waiting...)",
    talking: "(speaking)",
    interrupted: "(interrupted)"
  };

  return (
    <div>
      <div class="bar-label">{labels[effectiveState] || "\u25cb idle"}</div>
      <div class={"agent-bar agent-" + effectiveState}></div>
      <div class="bar-sub">{subs[effectiveState] || ""}</div>
    </div>
  );
}

// ── Dashboard ──
function Dashboard() {
  const [state, setState] = useState({});
  const [activity, setActivity] = useState([]);
  const [logs, setLogs] = useState([]);
  const [showSettings, setShowSettings] = useState(false);
  const logRef = React.useRef(null);

  useEffect(() => {
    if (logRef.current) {
      logRef.current.scrollTop = logRef.current.scrollHeight;
    }
  }, [logs]);

  useEffect(() => {
    poll();
    const t = setInterval(poll, 1000);
    return () => clearInterval(t);
  }, []);

  async function poll() {
    try {
      const [sr, ar, lr] = await Promise.all([
        fetch(API + "/state"),
        fetch(API + "/activity"),
        fetch(API + "/logs"),
      ]);
      setState(await sr.json());
      setActivity(await ar.json());
      setLogs((await lr.json()).lines || []);
    } catch(e) {}
  }

  async function post(url, body) {
    await fetch(API + url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    poll();
  }

  async function saveSettings() {
    const g = document.getElementById("set-groq").value;
    const d = document.getElementById("set-deepseek").value;
    if (g || d) {
      await fetch(API + "/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ groq_api_key: g, deepseek_api_key: d }),
      });
    }
    setShowSettings(false);
  }

  const running = state.running === true;

  return (
    <div class="dash">
      {/* Status Bar */}
      <div class="status-bar">
        <span class={"dot " + (running ? "on" : "off")}></span>
        <span class="identity">{state.agent || "heare"} {state.emoji || ""}</span>
        <span class="meta">{running ? "running" : "stopped — reopen Heare.app"}</span>
        <span class="meta">mode <strong>{state.mode || "?"}</strong></span>
        <span class="meta">
          provider{" "}
          <select value={state.provider || ""} onChange={e => { post("/provider", {provider: e.target.value}); }} style={{background:"var(--bg)",color:"var(--text)",border:"1px solid var(--border)",padding:"1px 4px",fontSize:10,borderRadius:3}}>
            {(state.providers || []).map(p => <option key={p} value={p}>{p}</option>)}
          </select>
        </span>
        <span class="meta">
          model{" "}
          <select value={state.model || ""} onChange={e => { post("/model", {model: e.target.value}); }} style={{background:"var(--bg)",color:"var(--text)",border:"1px solid var(--border)",padding:"1px 4px",fontSize:10,borderRadius:3}}>
            {(state.models || []).map(m => <option key={m} value={m}>{m}</option>)}
          </select>
        </span>
        <span class="meta">{state.transcripts_count || 0} msgs</span>
      </div>

      {/* Voice & Agent status bars */}
      <div class="viz-row">
        <div class="viz-col">
          <div class="bar-section-label">🎤 you</div>
          <UserVoiceBar voiceState={state.voice_state || {}} />
        </div>
        <div class="viz-col">
          <div class="bar-section-label">🤖 agent</div>
          <AgentStatusBar agentState={state.agent_state || {}} />
        </div>
      </div>

      <div class="row">
        {/* Controls */}
        <div class="col">
          <div class="card">
            <div class="card-header">controls</div>
            <div class="btn-row">
              {["silent","focus","ambient","assistant"].map(m =>
                <button key={m} class={"btn" + (state.mode === m ? " active" : "")} onClick={() => post("/mode", {mode: m})}>{m}</button>
              )}
            </div>
            <div class="btn-row">
            <button class="btn" onClick={() => post("/mute", {target: "bot"})}>{state.mute_bot === "1" || state.mute_bot === true ? "🔇 bot" : "🔊 bot"}</button>
            <button class="btn" onClick={() => post("/mute", {target: "mic"})}>{state.mute_mic === "1" || state.mute_mic === true ? "🔇 mic" : "🔊 mic"}</button>
              <button class="btn" onClick={() => post("/cancel", {})}>cancel</button>
              <button class="btn danger" onClick={() => post("/daemon", {action: "stop"})}>stop daemon</button>
            </div>
            <div class="btn-row">
              <button class="btn" onClick={() => setShowSettings(!showSettings)}>⚙ settings</button>
            </div>
          </div>
        </div>

        {/* Response */}
        <div class="col">
          <div class="card">
            <div class="card-header">response</div>
            <div class="response">{state.last_response || "—"}</div>
          </div>
        </div>

        {/* Stats */}
        <div class="col">
          <div class="card">
            <div class="card-header">stats</div>
            <div class="info-line">provider: <strong>{state.provider || "—"}</strong></div>
            <div class="info-line">model: <strong>{state.model || "—"}</strong></div>
            {state.usage && <div class="info-line">llm: {state.usage.llm_calls} calls, ${(state.usage.llm_cost_usd || 0).toFixed(4)}</div>}
          </div>
        </div>
      </div>

      {/* Settings Panel */}
      {showSettings && (
        <div class="card">
          <div class="card-header">⚙ settings</div>
          <div class="settings-panel">
            <div><label style={{fontSize:11,color:"var(--muted)"}}>Groq API Key</label><input id="set-groq" type="password" placeholder="gsk_..." /></div>
            <div><label style={{fontSize:11,color:"var(--muted)"}}>DeepSeek API Key</label><input id="set-deepseek" type="password" placeholder="sk-..." /></div>
          </div>
          <div style={{padding:"0 8px 8px"}}>
            <button class="btn primary" onClick={saveSettings} style={{width:"100%",fontSize:12}}>Save & Apply</button>
          </div>
        </div>
      )}

      {/* Activity */}
      <div class="card">
        <div class="card-header">activity ({activity.length})</div>
        <div class="scroll">
          <table>
            <thead><tr><th>time</th><th>who</th><th>content</th></tr></thead>
            <tbody>
              {activity.map((row, i) => (
                <tr key={i}>
                  <td style={{color:"var(--muted)",width:56}}>{new Date(row.ts * 1000).toTimeString().slice(0,8)}</td>
                  <td style={{color: row.who === "bot" ? "var(--accent-orange)" : "var(--accent-cyan)",width:36}}>{row.who}</td>
                  <td style={{overflow:"hidden",textOverflow:"ellipsis"}}>{(row.content || "").substring(0, 80)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Logs */}
      <div class="card">
        <div class="card-header">daemon log ({logs.length})</div>
        <div class="scroll" style={{maxHeight:150}} ref={logRef}>
          <table>
            <tbody>
              {logs.map((line, i) => (
                <tr key={i}><td style={{whiteSpace:"pre-wrap",wordBreak:"break-all",fontSize:11,color: line.toUpperCase().includes("ERROR") ? "var(--accent-red)" : line.toUpperCase().includes("WARN") ? "var(--accent-yellow)" : "var(--muted)"}}>{line}</td></tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
