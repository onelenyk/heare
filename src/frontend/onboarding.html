<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heare — Setup</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #21262d;
    --text: #c9d1d9; --muted: #8b949e; --accent: #7ee787;
    --accent-red: #ff7b72; --accent-cyan: #79c0ff;
    --sans: -apple-system,'Segoe UI',system-ui,sans-serif;
    --mono: 'SF Mono',monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 32px; max-width: 480px; width: 100%;
  }
  .logo { font-size: 48px; font-weight: 800; text-align: center; margin-bottom: 8px; letter-spacing: -1px; }
  .subtitle { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  .field input, .field select {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); padding: 10px 12px; font-size: 14px;
    border-radius: 6px; font-family: var(--mono);
  }
  .field input:focus, .field select:focus { border-color: var(--accent-cyan); outline: none; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .hint a { color: var(--accent-cyan); }
  .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: var(--accent); color: #000; font-size: 15px;
    font-weight: 700; cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .features { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
  .feature { font-size: 12px; color: var(--muted); padding: 8px; background: var(--bg); border-radius: 6px; text-align: center; }
  .feature strong { color: var(--text); display: block; margin-bottom: 2px; font-size: 13px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">heare</div>
  <div class="subtitle">Proactive ambient voice AI assistant</div>

  <form method="POST" action="/">
    <div class="field">
      <label>Groq API Key (Speech-to-Text)</label>
      <input name="groq_api_key" type="password" placeholder="gsk_..." autofocus>
      <div class="hint"><a href="https://console.groq.com/keys" target="_blank">Get a free key →</a></div>
    </div>
    <div class="field">
      <label>LLM API Key</label>
      <input name="deepseek_api_key" type="password" placeholder="sk-...">
      <div class="hint">
        Provider:
        <select name="provider" style="width:auto;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:2px 6px;font-size:11px;border-radius:3px;margin-left:4px">
          <option value="deepseek_api_key">DeepSeek</option>
          <option value="openrouter">OpenRouter</option>
          <option value="zai">z.ai</option>
          <option value="opencode">OpenCode</option>
        </select>
        <a href="https://platform.deepseek.com/api_keys" target="_blank">Get a key →</a>
      </div>
    </div>
    <hr class="divider">
    <div class="field">
      <label>Language</label>
      <select name="language">
        <option value="uk">Ukrainian</option>
        <option value="en" selected>English</option>
        <option value="ru">Russian</option>
      </select>
    </div>
    <div class="field">
      <label>Voice</label>
      <select name="tts_voice">
        <option value="en-US-AriaNeural">en-US-AriaNeural</option>
        <option value="uk-UA-OstapNeural">uk-UA-OstapNeural (male)</option>
        <option value="uk-UA-PolinaNeural">uk-UA-PolinaNeural (female)</option>
        <option value="ru-RU-SvetlanaNeural">ru-RU-SvetlanaNeural</option>
      </select>
    </div>
    <button type="submit">Save &amp; Start Heare</button>
  </form>

  <div class="features">
    <div class="feature"><strong>🎤 Always listening</strong>VAD-gated, no wake word</div>
    <div class="feature"><strong>🧠 Claude-powered</strong>Autonomous decisions</div>
    <div class="feature"><strong>🌐 Browser control</strong>Chrome extension bridge</div>
    <div class="feature"><strong>🔧 Developer tools</strong>Bash, files, web search</div>
  </div>
</div>
</body>
</html>
