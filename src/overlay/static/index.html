<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>heare</title>
    <link rel="stylesheet" href="/static/overlay.css" />
  </head>
  <body>
    <header class="bar">
      <div class="pill" id="status-pill">
        <span class="dot"></span><span id="status-label">offline</span>
      </div>
      <div class="actions">
        <button id="btn-mic" title="Mute mic">🎤</button>
        <button id="btn-out" title="Mute output">🔊</button>
        <button id="btn-cancel" title="Cancel current turn">⏹</button>
      </div>
    </header>

    <section class="transcript" id="transcript">
      <div class="hint">Waiting for daemon…</div>
    </section>

    <details class="debug">
      <summary>Debug</summary>
      <dl id="debug-list">
        <dt>audio_event</dt><dd id="dbg-audio">—</dd>
        <dt>state</dt><dd id="dbg-state">—</dd>
        <dt>last partial</dt><dd id="dbg-partial">—</dd>
      </dl>
    </details>

    <script src="/static/overlay.js" defer></script>
  </body>
</html>
